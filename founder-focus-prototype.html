  <style>
    :root {
      --green: #19782e;
      --navy: #14253d;
      --blue: #1b48d8;
      --gold: #fdd215;
      --bg: #eef7f0;
      --surface: #fffdf6;
      --border: #d8d2bf;
      --text: #0F172A;
      --text-soft: #5e6470;
      --radius: 10px;
      --shadow: 0 14px 0 rgba(20,37,61,0.07), 0 18px 40px rgba(20,37,61,0.11);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: linear-gradient(135deg, rgba(253,210,21,0.10) 0 18%, transparent 18% 100%),
                  linear-gradient(180deg, #eef7f0 0%, #e4f0e7 100%);
      color: var(--text);
      padding: 24px 16px 80px;
    }
    .shell {
      max-width: 640px;
      margin: 0 auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
      font-size: 15px;
      font-weight: 700;
      color: var(--navy);
    }
    .brand span { opacity: 0.5; font-weight: 400; margin: 0 6px; }
    .brand strong { color: var(--green); }
    .card {
      background: var(--surface);
      border: 2px solid var(--navy);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .kicker {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--green);
      margin: 0 0 8px;
    }
    h2 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.25;
    }
    h2.step-title { font-size: 18px; }
    .step-prompt {
      margin: 0 0 20px;
      font-size: 14px;
      color: var(--text-soft);
      line-height: 1.55;
    }
    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 16px;
    }
    .field label {
      font-size: 13px;
      font-weight: 600;
      color: var(--navy);
    }
    .field input,
    .field select {
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 15px;
      color: var(--text);
      width: 100%;
    }
    .field input:focus,
    .field select:focus {
      outline: none;
      border-color: var(--blue);
    }
    .options { display: grid; gap: 10px; }
    .option-btn {
      width: 100%;
      text-align: left;
      padding: 16px;
      border-radius: 16px;
      border: 2px solid var(--navy);
      background: var(--surface);
      display: grid;
      gap: 4px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .option-btn:hover { border-color: var(--blue); background: rgba(27,72,216,0.06); }
    .option-btn.selected { border-color: var(--blue); background: rgba(27,72,216,0.14); }
    .option-btn strong { font-size: 15px; display: block; }
    .option-btn small { font-size: 13px; color: var(--text-soft); line-height: 1.4; }
    .nav {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .btn {
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--navy);
      color: #fff;
    }
    .btn-primary:hover { background: var(--blue); }
    .btn-ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--text-soft);
    }
    .btn-ghost:hover { border-color: var(--navy); color: var(--navy); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .progress {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      align-items: center;
    }
    .progress-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border);
    }
    .progress-dot.done { background: var(--green); }
    .progress-dot.active { background: var(--navy); width: 24px; border-radius: 4px; }
    .progress-label {
      margin-left: 8px;
      font-size: 12px;
      color: var(--text-soft);
    }
    .hidden { display: none !important; }

    /* RESULT STYLES */
    #result-shell { display: none; }
    .result-header {
      background: var(--navy);
      color: #fff;
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }
    .result-header .kicker { color: var(--gold); }
    .result-header h1 {
      margin: 8px 0 12px;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.25;
    }
    .result-goal-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .goal-pill {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .result-section {
      background: var(--surface);
      border: 2px solid var(--navy);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .result-section-header {
      margin-bottom: 18px;
    }
    .result-section-num {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--blue);
      margin: 0 0 4px;
    }
    .result-section-title {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 800;
      color: var(--navy);
    }
    .result-section-sub {
      margin: 0;
      font-size: 13px;
      color: var(--text-soft);
      line-height: 1.5;
    }
    .tool-entry { margin-bottom: 20px; }
    .tool-entry:last-child { margin-bottom: 0; }
    .tool-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--navy);
      margin: 0 0 6px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .tool-cost {
      font-size: 12px;
      font-weight: 600;
      color: var(--green);
      background: rgba(25,120,46,0.1);
      border-radius: 4px;
      padding: 1px 7px;
    }
    .tool-link {
      font-size: 11px;
      color: var(--blue);
      text-decoration: underline;
      font-weight: 500;
      margin-left: auto;
    }
    .tool-desc {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
    }
    .note-box {
      background: rgba(253,210,21,0.15);
      border: 1px solid rgba(253,210,21,0.5);
      border-radius: 8px;
      padding: 14px 16px;
      margin-top: 14px;
    }
    .note-box p { margin: 0; font-size: 13px; line-height: 1.55; }
    .todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 12px;
    }
    .todo-list li {
      display: flex;
      gap: 12px;
      font-size: 14px;
      line-height: 1.55;
    }
    .todo-num {
      flex-shrink: 0;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--navy);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      margin-top: 1px;
    }
    .result-footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-soft);
      margin-top: 20px;
      padding: 16px;
      border-top: 1px solid var(--border);
    }
    .result-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .btn-pdf {
      background: var(--green);
      color: #fff;
      border-color: transparent;
    }
    .btn-pdf:hover { background: #155f24; }

    @media print {
      body { background: #fff; padding: 0; }
      .result-actions, #quiz-shell, .brand { display: none !important; }
      #result-shell { display: block !important; }
      .result-header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .result-section { page-break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
    }

    @media (max-width: 480px) {
      .result-header h1 { font-size: 18px; }
    }
  </style>
</head>

// ─── QUIZ STATE ───────────────────────────────────────────────────────────────

const allStates = ["Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","District of Columbia","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming"];

const businessTypeLabels = {
  "mobile-service": "Mobile or On-Site Service",
  "local-service":  "Appointment-Based Local Service",
  "online-service": "Online or Remote Service",
  "product":        "Product Business",
  "venue":          "Experience or Venue"
};

const budgetLabels = {
  "free": "Starting with $0",
  "low":  "Budget under $50/month",
  "paid": "Open to investing in tools"
};

let step = 0;
let selections = { name: "", idea: "", businessType: "", state: "", budget: "" };

const steps = ["intro", "businessType", "state", "budget"];

// ─── QUIZ RENDERING ───────────────────────────────────────────────────────────

function updateProgress() {
  const dots = document.getElementById("progressDots");
  dots.innerHTML = steps.map((s, i) => {
    const cls = i < step ? "progress-dot done" : i === step ? "progress-dot active" : "progress-dot";
    return `<div class="${cls}"></div>`;
  }).join("") + `<span class="progress-label">Step ${step + 1} of ${steps.length}</span>`;
}

function renderStep() {
  updateProgress();
  const card = document.getElementById("stepCard");
  if (step === 0) renderIntro(card);
  else if (step === 1) renderBusinessType(card);
  else if (step === 2) renderState(card);
  else if (step === 3) renderBudget(card);
}

function renderIntro(card) {
  card.innerHTML = `
    <p class="kicker">Founder Focus</p>
    <h2>Your personalized founder tool stack.</h2>
    <p class="step-prompt">Answer four quick questions and we will build a practical, budget-aware tool plan for your specific business and state.</p>
    <div class="field">
      <label for="nameInput">Your first name <span style="font-weight:400;color:var(--text-soft)">(optional)</span></label>
      <input id="nameInput" type="text" placeholder="e.g. Sarah" value="${selections.name}">
    </div>
    <div class="field">
      <label for="ideaInput">Your business idea <span style="font-weight:400;color:var(--text-soft)">(optional - used in your plan title)</span></label>
      <input id="ideaInput" type="text" placeholder="e.g. Mobile Car Detailing, Virtual Assistant, Escape Room" value="${selections.idea}">
    </div>
    <div class="nav">
      <button class="btn btn-primary" onclick="nextFromIntro()">Next</button>
    </div>
  `;
}

function nextFromIntro() {
  selections.name = document.getElementById("nameInput").value.trim();
  selections.idea = document.getElementById("ideaInput").value.trim();
  step = 1;
  renderStep();
}

function renderBusinessType(card) {
  const options = [
    { value: "mobile-service", label: "Mobile or on-site service", detail: "You go to the client - cleaning, detailing, lawn care, trades, delivery, mobile services." },
    { value: "local-service",  label: "Appointment-based local service", detail: "Clients come to you or meet you locally - notary, salon, wellness, studio, pet care." },
    { value: "online-service", label: "Online or remote service", detail: "You work from anywhere - virtual assistant, consulting, content, coaching, design." },
    { value: "product",        label: "Product business", detail: "Physical or digital products - e-commerce, resale, print-on-demand, handmade goods." },
    { value: "venue",          label: "Experience or venue", detail: "Clients pay to be somewhere you operate - escape room, studio, retreat, lodging, karaoke." }
  ];
  card.innerHTML = `
    <p class="kicker">Step 1 of 3</p>
    <h2 class="step-title">What kind of business are you building?</h2>
    <p class="step-prompt">Choose the type that fits closest. You can run the recommender again to see how the stack changes.</p>
    <div class="options">
      ${options.map(o => `
        <button class="option-btn ${selections.businessType === o.value ? "selected" : ""}" onclick="selectBusinessType('${o.value}')">
          <strong>${o.label}</strong>
          <small>${o.detail}</small>
        </button>`).join("")}
    </div>
    <div class="nav">
      <button class="btn btn-ghost" onclick="step=0;renderStep()">Back</button>
      <button class="btn btn-primary" id="nextBT" ${!selections.businessType ? "disabled" : ""} onclick="step=2;renderStep()">Next</button>
    </div>
  `;
}

function selectBusinessType(val) {
  selections.businessType = val;
  document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
  event.currentTarget.classList.add("selected");
  document.getElementById("nextBT").disabled = false;
}

function renderState(card) {
  const opts = allStates.map(s => `<option value="${s}" ${selections.state === s ? "selected" : ""}>${s}</option>`).join("");
  card.innerHTML = `
    <p class="kicker">Step 2 of 3</p>
    <h2 class="step-title">What state are you in?</h2>
    <p class="step-prompt">Your state determines the registration links and legal context in your plan.</p>
    <div class="field">
      <label for="stateSelect">Select your state</label>
      <select id="stateSelect" onchange="selections.state=this.value;document.getElementById('nextState').disabled=!this.value">
        <option value="">-- Choose your state --</option>
        ${opts}
      </select>
    </div>
    <div class="nav">
      <button class="btn btn-ghost" onclick="step=1;renderStep()">Back</button>
      <button class="btn btn-primary" id="nextState" ${!selections.state ? "disabled" : ""} onclick="step=3;renderStep()">Next</button>
    </div>
  `;
}

function renderBudget(card) {
  const options = [
    { value: "free", label: "Free tools only",            detail: "I want to start lean. I will only use tools with no monthly cost." },
    { value: "low",  label: "Under $50 per month",        detail: "I can cover a small tool cost if it clearly saves time or makes money." },
    { value: "paid", label: "Open to investing in tools", detail: "I will pay for tools that clearly earn their cost through efficiency or revenue." }
  ];
  card.innerHTML = `
    <p class="kicker">Step 3 of 3</p>
    <h2 class="step-title">What is your starting budget for tools?</h2>
    <p class="step-prompt">Most strong stacks start free. Be honest - you can always upgrade later.</p>
    <div class="options">
      ${options.map(o => `
        <button class="option-btn ${selections.budget === o.value ? "selected" : ""}" onclick="selectBudget('${o.value}')">
          <strong>${o.label}</strong>
          <small>${o.detail}</small>
        </button>`).join("")}
    </div>
    <div class="nav">
      <button class="btn btn-ghost" onclick="step=2;renderStep()">Back</button>
      <button class="btn btn-primary" id="nextBudget" ${!selections.budget ? "disabled" : ""} onclick="generateResult()">Build My Stack</button>
    </div>
  `;
}

function selectBudget(val) {
  selections.budget = val;
  document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
  event.currentTarget.classList.add("selected");
  document.getElementById("nextBudget").disabled = false;
}

// ─── RESULT GENERATION ────────────────────────────────────────────────────────

function getFilteredTools(sectionId) {
  const budgetOrder = { free: 0, low: 1, paid: 2 };
  const userLevel = budgetOrder[selections.budget] || 0;
  return stackTools.filter(t => {
    if (t.section !== sectionId) return false;
    if (t.showFor && !t.showFor.includes(selections.businessType)) return false;
    const toolLevel = budgetOrder[t.budgetTier] || 0;
    if (toolLevel > userLevel) return false;
    return true;
  });
}

function renderToolEntry(tool) {
  const desc = tool.contexts[selections.businessType] || Object.values(tool.contexts)[0];
  return `
    <div class="tool-entry">
      <div class="tool-name">
        ${tool.name}
        <span class="tool-cost">${tool.costLabel}</span>
        <a class="tool-link" href="${tool.link}" target="_blank" rel="noopener">Visit &rarr;</a>
      </div>
      <p class="tool-desc">${desc}</p>
    </div>
  `;
}

function generateResult() {
  const { name, idea, businessType, state, budget } = selections;

  const displayName = name || "You";
  const stateSlug = state.toLowerCase().replace(/\s+/g, "-");
  const statePageUrl = `/states/${stateSlug}.html`;
  const businessLabel = businessTypeLabels[businessType] || businessType;
  const budgetLabel = budgetLabels[budget] || budget;

  const planTitle = idea
    ? `${displayName}'s Game Plan: ${idea} (${state})`
    : `${displayName}'s Game Plan: ${businessLabel} in ${state}`;

  const sections = sectionConfig[businessType] || sectionConfig["mobile-service"];

  let html = `
    <div class="result-header">
      <p class="kicker">Your Personalized Founder Stack</p>
      <h1>${planTitle}</h1>
      <div class="result-goal-pills">
        <span class="goal-pill">${businessLabel}</span>
        <span class="goal-pill">${state}</span>
        <span class="goal-pill">${budgetLabel}</span>
      </div>
    </div>
  `;

  for (const sec of sections) {
    if (sec.id === "legal") {
      // Legal section rendered separately
      html += `
        <div class="result-section">
          <div class="result-section-header">
            <p class="result-section-num">Section ${sec.num}</p>
            <h2 class="result-section-title">${sec.title}</h2>
            <p class="result-section-sub">${sec.sub}</p>
          </div>
          <div class="tool-entry">
            <div class="tool-name">
              ${state} Business Registration
              <span class="tool-cost">State Filing Fee Applies</span>
              <a class="tool-link" href="${statePageUrl}" target="_blank" rel="noopener">State Info &rarr;</a>
            </div>
            <p class="tool-desc">Register your business with ${state}. The specific form depends on your structure - sole proprietorship, LLC, or corporation. Filing online through your Secretary of State is the fastest route. Your state page on Income Spectrum has the direct links.</p>
          </div>
          <div class="tool-entry">
            <div class="tool-name">
              IRS EIN Application
              <span class="tool-cost">Free</span>
              <a class="tool-link" href="https://www.irs.gov/businesses/small-businesses-self-employed/employer-id-numbers" target="_blank" rel="noopener">Apply at IRS.gov &rarr;</a>
            </div>
            <p class="tool-desc">Apply for your Employer Identification Number directly through the IRS website. It is free, instant, and required for opening a business bank account and paying employees. Takes about 10 minutes online.</p>
          </div>
          <div class="note-box">
            <p><strong>For ${state}:</strong> ${legalNotes[businessType]}</p>
          </div>
        </div>
      `;
    } else {
      const tools = getFilteredTools(sec.id);
      if (!tools.length) continue;

      let sectionHtml = tools.map(renderToolEntry).join("");

      // Payments section: always add bank account note
      if (sec.id === "payments") {
        sectionHtml += `
          <div class="note-box">
            <p><strong>The bank account habit:</strong> ${bankNotes[businessType]}</p>
          </div>
        `;
      }

      html += `
        <div class="result-section">
          <div class="result-section-header">
            <p class="result-section-num">Section ${sec.num}</p>
            <h2 class="result-section-title">${sec.title}</h2>
            <p class="result-section-sub">${sec.sub}</p>
          </div>
          ${sectionHtml}
        </div>
      `;
    }
  }

  // First Week To-Do List
  const todos = todoLists[businessType] || [];
  html += `
    <div class="result-section">
      <div class="result-section-header">
        <p class="result-section-num">Your First Week</p>
        <h2 class="result-section-title">The First-Week To-Do List</h2>
        <p class="result-section-sub">The five moves that matter most before anything else.</p>
      </div>
      <ul class="todo-list">
        ${todos.map((t, i) => `
          <li>
            <span class="todo-num">${i + 1}</span>
            <span>${t}</span>
          </li>`).join("")}
      </ul>
    </div>
  `;

  document.getElementById("result-output").innerHTML = html;
  document.getElementById("footerDate").textContent = new Date().toLocaleDateString("en-US", { month: "long", year: "numeric" });
  document.getElementById("quiz-shell").style.display = "none";
  document.getElementById("result-shell").style.display = "block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function printResult() {
  window.print();
}

function restartQuiz() {
  selections = { name: "", idea: "", businessType: "", state: "", budget: "" };
  step = 0;
  document.getElementById("result-shell").style.display = "none";
  document.getElementById("quiz-shell").style.display = "block";
  renderStep();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderStep();
</script>
