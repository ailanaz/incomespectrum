        title: "Your Focus",
        prompt: "Your focus is where The Six, the Cost of Living, the culture, and your working style all point in the same direction. The Income Spectrum directory is organized around this: income opportunities, education and training, support services, and official resources are all indexed so you can find and build from a clear starting point. This question maps everything you have identified to the section of the directory that fits your focus best - and gives you a working direction to take into the Founder File.",
        question: "Which kind of income opportunity fits the focus taking shape in your answers?",
        options: [
          { value: "service", label: "A service", detail: "You deliver work directly to people using your skills or time." },
          { value: "product", label: "A product", detail: "People buy something you make, source, package, or sell." },
          { value: "ownership", label: "Ownership or acquisition", detail: "You want to buy into or own a business rather than build from scratch." },
          { value: "information", label: "Information or guidance", detail: "You help people understand, decide, or navigate something." },
          { value: "recurring", label: "A recurring or asset-based model", detail: "You want income tied to something you own or have set up, not just your hours." },
          { value: "sorting", label: "Still sorting", detail: "You need to explore more before you can commit to a direction." }
        ]
      }
    ]
  };

  // ─── STATE ─────────────────────────────────────────────────────────────────

  let qzIndex = -1;
  const answers = {};
  let result = null;

  // ─── SCORING ───────────────────────────────────────────────────────────────

  function buildResult() {
    const driver = answers.driver || "stability";
    const style = answers.style || "solving";
    const cost = answers.cost || "time";
    const opportunity = answers.opportunity || "better-result";
    const culture = answers.culture || driver;
    const founderIdentity = answers.founder || "Still sorting";
    const focus = answers.focus || "sorting";

    const allIncomeIds = ["income-mobile-notary","income-virtual-assistant","income-asl-interpreting","income-print-on-demand","income-commercial-cleaning","income-hydroseeding","income-escape-room","income-karaoke-venue","income-laundry-pickup","income-lice-removal","income-capsule-hotel","income-postpartum-retreat","income-pet-funeral","income-death-doula","income-government-contracting","income-used-ebike","income-mobile-battery","income-storefront-setup","income-listing-optimization","income-vertical-content","income-driveway-paver","income-crawlspace-cleanup"];
    const allTrainingIds = ["training-business-foundations","training-operations-basics","training-digital-storefront","training-brand-basics","training-certification-prep","training-asl-pathways","training-government-contracting","training-notary-basics","training-va-systems","training-hydroseeding"];

    const incomeScores = Object.fromEntries(allIncomeIds.map(id => [id, 0]));
    const trainingScores = Object.fromEntries(allTrainingIds.map(id => [id, 0]));

    function add(bucket, ids, pts) { (ids||[]).forEach(id => { if (id in bucket) bucket[id] += pts; }); }
    function sub(bucket, ids, pts) { (ids||[]).forEach(id => { if (id in bucket) bucket[id] -= pts; }); }
    function top(bucket, n) {
      return Object.entries(bucket).sort((a,b)=>b[1]-a[1]).filter(e=>e[1]>0).slice(0,n).map(e=>e[0]);
    }

    const focusMap = {
      service:    { incomeIds: ["income-mobile-notary","income-virtual-assistant","income-commercial-cleaning","income-mobile-battery","income-laundry-pickup","income-crawlspace-cleanup"], trainingIds: ["training-business-foundations","training-operations-basics","training-certification-prep"] },
      product:    { incomeIds: ["income-print-on-demand","income-used-ebike","income-karaoke-venue","income-escape-room","income-capsule-hotel"], trainingIds: ["training-digital-storefront","training-brand-basics","training-business-foundations"] },
      ownership:  { incomeIds: ["income-government-contracting","income-commercial-cleaning","income-escape-room","income-hydroseeding","income-capsule-hotel"], trainingIds: ["training-business-foundations","training-government-contracting"] },
      information:{ incomeIds: ["income-storefront-setup","income-listing-optimization","income-vertical-content","income-government-contracting","income-virtual-assistant"], trainingIds: ["training-business-foundations","training-digital-storefront","training-government-contracting","training-certification-prep"] },
      recurring:  { incomeIds: ["income-laundry-pickup","income-commercial-cleaning","income-government-contracting","income-capsule-hotel","income-mobile-battery"], trainingIds: ["training-business-foundations","training-operations-basics","training-government-contracting"] },
      sorting:    { incomeIds: ["income-mobile-notary","income-laundry-pickup","income-government-contracting","income-virtual-assistant","income-commercial-cleaning"], trainingIds: ["training-business-foundations","training-digital-storefront"] }
    };
    const currentFocus = focusMap[focus] || focusMap.sorting;

    const styleBoosts = {
      solving:    ["income-mobile-battery","income-commercial-cleaning","income-crawlspace-cleanup","income-lice-removal"],
      improving:  ["income-listing-optimization","income-hydroseeding","income-driveway-paver","income-vertical-content"],
      organizing: ["income-virtual-assistant","income-government-contracting","income-laundry-pickup","income-mobile-notary"],
      guiding:    ["income-mobile-notary","income-government-contracting","income-virtual-assistant","income-listing-optimization"],
      creating:   ["income-print-on-demand","income-vertical-content","income-escape-room","income-karaoke-venue"],
      connecting: ["income-asl-interpreting","income-death-doula","income-pet-funeral","income-postpartum-retreat"]
    };
    const driverBoosts = {
      relief:      ["income-commercial-cleaning","income-crawlspace-cleanup","income-lice-removal","income-mobile-battery"],
      stability:   ["income-mobile-notary","income-government-contracting","income-mobile-battery","income-asl-interpreting"],
      access:      ["income-asl-interpreting","income-storefront-setup","income-mobile-notary","income-government-contracting"],
      improvement: ["income-listing-optimization","income-driveway-paver","income-hydroseeding","income-used-ebike"],
      connection:  ["income-asl-interpreting","income-death-doula","income-postpartum-retreat","income-pet-funeral"],
      enjoyment:   ["income-print-on-demand","income-karaoke-venue","income-escape-room","income-capsule-hotel"]
    };
    const founderBoosts = {
      Entrepreneur:        ["income-escape-room","income-karaoke-venue","income-capsule-hotel","income-government-contracting","income-used-ebike"],
      Solopreneur:         ["income-virtual-assistant","income-mobile-notary","income-listing-optimization","income-vertical-content"],
      "Small Business Owner": ["income-commercial-cleaning","income-hydroseeding","income-laundry-pickup","income-driveway-paver","income-mobile-battery"],
      Freelancer:          ["income-listing-optimization","income-vertical-content","income-virtual-assistant","income-mobile-notary"],
      "Owner-Operator":    ["income-mobile-battery","income-hydroseeding","income-commercial-cleaning","income-laundry-pickup","income-driveway-paver","income-crawlspace-cleanup"],
      "Still sorting":     ["income-mobile-notary","income-virtual-assistant","income-commercial-cleaning","income-government-contracting"]
    };
    const costBoosts = {
      time:      ["income-virtual-assistant","income-mobile-notary","income-laundry-pickup","income-mobile-battery"],
      energy:    ["income-commercial-cleaning","income-crawlspace-cleanup","income-driveway-paver","income-hydroseeding"],
      attention: ["income-listing-optimization","income-virtual-assistant","income-government-contracting","income-mobile-notary"],
      comfort:   ["income-capsule-hotel","income-postpartum-retreat","income-death-doula","income-pet-funeral"],
      risk:      ["income-government-contracting","income-mobile-notary","income-asl-interpreting"],
      mix:       ["income-virtual-assistant","income-government-contracting","income-mobile-notary","income-commercial-cleaning"]
    };
    const opportunityBoosts = {
      "save-time":       ["income-virtual-assistant","income-laundry-pickup","income-mobile-battery","income-mobile-notary"],
      "use-less-energy": ["income-commercial-cleaning","income-crawlspace-cleanup","income-driveway-paver","income-laundry-pickup"],
      "decide-clearly":  ["income-listing-optimization","income-government-contracting","income-mobile-notary","income-virtual-assistant"],
      "feel-better":     ["income-pet-funeral","income-death-doula","income-postpartum-retreat","income-lice-removal"],
      "better-result":   ["income-hydroseeding","income-driveway-paver","income-listing-optimization","income-vertical-content"],
      "enjoy-more":      ["income-karaoke-venue","income-escape-room","income-capsule-hotel","income-print-on-demand"]
    };
    const driverPenalties = {
      stability:   ["income-karaoke-venue","income-escape-room","income-capsule-hotel","income-print-on-demand","income-used-ebike"],
      access:      ["income-karaoke-venue","income-escape-room","income-print-on-demand","income-used-ebike","income-crawlspace-cleanup"],
      relief:      ["income-karaoke-venue","income-escape-room","income-capsule-hotel","income-used-ebike"],
      connection:  ["income-listing-optimization","income-mobile-battery","income-crawlspace-cleanup","income-driveway-paver","income-hydroseeding"],
      improvement: ["income-crawlspace-cleanup","income-lice-removal","income-laundry-pickup","income-pet-funeral"],
      enjoyment:   ["income-government-contracting","income-crawlspace-cleanup","income-lice-removal","income-mobile-notary"]
    };
    const stylePenalties = {
      creating:   ["income-commercial-cleaning","income-crawlspace-cleanup","income-laundry-pickup","income-mobile-notary","income-government-contracting"],
      connecting: ["income-listing-optimization","income-mobile-battery","income-hydroseeding","income-driveway-paver","income-crawlspace-cleanup"],
      solving:    ["income-laundry-pickup","income-print-on-demand","income-karaoke-venue","income-capsule-hotel"],
      organizing: ["income-karaoke-venue","income-escape-room","income-print-on-demand"],
      improving:  ["income-death-doula","income-pet-funeral","income-postpartum-retreat","income-lice-removal"],
      guiding:    ["income-commercial-cleaning","income-crawlspace-cleanup","income-mobile-battery","income-hydroseeding"]
    };
    const opportunityPenalties = {
      "enjoy-more":      ["income-government-contracting","income-mobile-notary","income-commercial-cleaning","income-crawlspace-cleanup","income-lice-removal"],
      "feel-better":     ["income-government-contracting","income-listing-optimization","income-hydroseeding","income-used-ebike"],
      "better-result":   ["income-karaoke-venue","income-escape-room","income-death-doula","income-pet-funeral"],
      "save-time":       ["income-karaoke-venue","income-escape-room","income-print-on-demand","income-capsule-hotel"],
      "use-less-energy": ["income-listing-optimization","income-vertical-content","income-print-on-demand","income-karaoke-venue"],
      "decide-clearly":  ["income-karaoke-venue","income-escape-room","income-commercial-cleaning","income-crawlspace-cleanup","income-used-ebike"]
    };

    add(incomeScores, currentFocus.incomeIds, 5);
    add(incomeScores, styleBoosts[style] || [], 3);
    add(incomeScores, driverBoosts[driver] || [], 3);
    if (culture !== driver) add(incomeScores, driverBoosts[culture] || [], 2);
    add(incomeScores, founderBoosts[founderIdentity] || [], 1);
    add(incomeScores, costBoosts[cost] || [], 1);
    add(incomeScores, opportunityBoosts[opportunity] || [], 3);
    sub(incomeScores, driverPenalties[driver] || [], 3);
    sub(incomeScores, stylePenalties[style] || [], 2);
    sub(incomeScores, opportunityPenalties[opportunity] || [], 2);

    const suggestedIncomeIds = top(incomeScores, 3).length ? top(incomeScores, 3) : currentFocus.incomeIds.slice(0,3);

    suggestedIncomeIds.forEach((id, i) => {
      // boost training from income item associations (simplified - use focus map training)
    });
    add(trainingScores, currentFocus.trainingIds, 3);
    if (driver === "connection" || culture === "connection") add(trainingScores, ["training-asl-pathways","training-certification-prep"], 1);
    if (driver === "improvement" || opportunity === "better-result") add(trainingScores, ["training-brand-basics","training-digital-storefront","training-operations-basics"], 1);
    if (opportunity === "decide-clearly") add(trainingScores, ["training-business-foundations","training-government-contracting"], 1);

    const suggestedTrainingIds = top(trainingScores, 3);

    // Infer founder identity
    function inferFounderType(st, dr) {
      if (st === "creating") return "Solopreneur";
      if (st === "connecting") return "Small Business Owner";
      if (st === "solving") return "Owner-Operator";
      if (st === "organizing") return "Owner-Operator";
      if (st === "guiding") return (dr === "access" || dr === "improvement") ? "Freelancer" : "Small Business Owner";
      if (st === "improving") return dr === "improvement" ? "Entrepreneur" : "Small Business Owner";
      return "Founder";
    }
    const inferredFounderIdentity = (founderIdentity === "Still sorting" || !founderIdentity) ? inferFounderType(style, driver) : founderIdentity;

    const styleLabels = { solving:"Solving", improving:"Improving", organizing:"Organizing", guiding:"Guiding", creating:"Creating", connecting:"Connecting" };
    const driverLabels = { relief:"Relief", stability:"Stability", access:"Access", improvement:"Improvement", connection:"Connection", enjoyment:"Enjoyment" };
    const sid = (styleLabels[style] || style).toLowerCase();
    const did = (driverLabels[driver] || driver).toLowerCase();
    let founderIdentityFit = "";
    if (inferredFounderIdentity === "Entrepreneur") {
      founderIdentityFit = `An improving style in a ${did} market signals someone building toward outcomes beyond their own direct labor. That is the Entrepreneur pattern.`;
    } else if (inferredFounderIdentity === "Solopreneur") {
      founderIdentityFit = `Creating is your work style and ${did} is your market. A Solopreneur owns the business and delivers the output themselves - that combination fits here.`;
    } else if (inferredFounderIdentity === "Small Business Owner") {
      founderIdentityFit = `Your ${sid} style in a ${did} market reads as someone building a defined business for a specific community or client base.`;
    } else if (inferredFounderIdentity === "Freelancer") {
      founderIdentityFit = `A guiding style with a ${did} market focus is a Freelancer pattern - independent work delivered directly to clients who need a specific expertise.`;
    } else if (inferredFounderIdentity === "Owner-Operator") {
      founderIdentityFit = `Your ${sid} style in a ${did} market reads as someone who wants to own the operation and stay in the work. That is Owner-Operator.`;
    } else {
      founderIdentityFit = "Your answers show someone building with clear intent. Founder is the right label when the shape is still forming but the direction is real.";
    }

    return { inferredFounderIdentity, founderIdentityFit, suggestedIncomeIds, suggestedTrainingIds };
  }

  // ─── RENDER ────────────────────────────────────────────────────────────────

  const bar = document.getElementById("qzBar");
  const label = document.getElementById("qzLabel");
  const body = document.getElementById("qzBody");

  function setProgress(pct, text) {
    bar.style.width = pct + "%";
    label.textContent = text;
  }

  function render() {
    window.scrollTo({ top: 0, behavior: "smooth" });

    if (result) {
      renderResult();
      return;
    }

    if (qzIndex === -1) {
      setProgress(0, "Introduction");
      body.innerHTML = `
        <div class="qz-intro-card">
          <h2>Find Your Focus</h2>
          ${quiz.intro}
          <p style="font-size:13px;color:#94a3b8;margin:16px 0 0">${quiz.optionPrompt}</p>
        </div>
        <div class="qz-intro-footer">
          <a href="app.html" class="qz-app-link">Explore the app &rarr;</a>
          <button class="qz-btn qz-btn--primary" id="qzBegin">Begin Quiz</button>
        </div>
      `;
      document.getElementById("qzBegin").addEventListener("click", () => {
        qzIndex = 0;
        render();
      });
      return;
    }

    const q = quiz.questions[qzIndex];
    const selected = answers[q.id];
    const isLast = qzIndex === quiz.questions.length - 1;
    setProgress(((qzIndex + 1) / quiz.questions.length) * 100, `Question ${qzIndex + 1} of ${quiz.questions.length}`);

    body.innerHTML = `
      <p class="qz-title">${q.title}</p>
      ${q.prompt ? `<p class="qz-prompt">${q.prompt}</p>` : ""}
      <p class="qz-question">${q.question}</p>
      <div class="qz-options">
        ${q.options.map(opt => `
          <button class="qz-option${selected === opt.value ? " selected" : ""}" data-value="${opt.value}">
            <strong>${opt.label}</strong>
            ${opt.detail ? `<small>${opt.detail}</small>` : ""}
          </button>
        `).join("")}
      </div>
      <div class="qz-nav">
        ${qzIndex > 0 ? `<button class="qz-btn qz-btn--ghost" id="qzBack">Back</button>` : "<span></span>"}
        <button class="qz-btn qz-btn--primary" id="qzNext" ${!selected ? "disabled" : ""}>${isLast ? "See Result" : "Next"}</button>
      </div>
    `;

    body.querySelectorAll(".qz-option").forEach(btn => {
      btn.addEventListener("click", () => {
        answers[q.id] = btn.dataset.value;
        body.querySelectorAll(".qz-option").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        document.getElementById("qzNext").disabled = false;
      });
    });

    document.getElementById("qzNext").addEventListener("click", () => {
      if (!answers[q.id]) return;
      if (!isLast) {
        qzIndex++;
        render();
      } else {
        result = buildResult();
        render();
      }
    });

    const backBtn = document.getElementById("qzBack");
    if (backBtn) {
      backBtn.addEventListener("click", () => {
        qzIndex--;
        render();
      });
    }
  }

  function renderResult() {
    setProgress(100, "Result");
    const { inferredFounderIdentity, founderIdentityFit, suggestedIncomeIds, suggestedTrainingIds } = result;
    const identityDesc = founderIdentityDescriptions[inferredFounderIdentity] || founderIdentityDescriptions.Founder;

    const incomeHtml = suggestedIncomeIds.map(id => `
      <li class="qz-idea-item">
        <p class="qz-idea-title">${incomeTitles[id] || id}</p>
        ${hookMap[id] ? `<p class="qz-idea-hook">${hookMap[id]}</p>` : ""}
      </li>
    `).join("");

    const trainingHtml = suggestedTrainingIds.length ? `
      <div class="qz-result-block">
        <p class="qz-result-label">Education Worth Looking At</p>
        <ul class="qz-training-list">
          ${suggestedTrainingIds.map(id => `<li>${trainingTitles[id] || id}</li>`).join("")}
        </ul>
      </div>
    ` : "";

    body.innerHTML = `
      <div class="qz-result">
        <div class="qz-result-block qz-result-block--identity">
          <p class="qz-result-label">Your Founder Identity</p>
          <h2 class="qz-identity-name">${inferredFounderIdentity}</h2>
          <p class="qz-identity-desc">${identityDesc}</p>
          ${founderIdentityFit ? `<p class="qz-identity-fit">${founderIdentityFit}</p>` : ""}
        </div>
        <div class="qz-result-block">
          <p class="qz-result-label">Income Ideas to Explore</p>
          <ul class="qz-idea-list">${incomeHtml}</ul>
        </div>
        ${trainingHtml}
        <div class="qz-result-footer">
          <button class="qz-restart" id="qzRestart">Retake the quiz</button>
          <a href="app.html" class="qz-app-link">Explore the app &rarr;</a>
        </div>
      </div>
    `;

    document.getElementById("qzRestart").addEventListener("click", () => {
      qzIndex = -1;
      result = null;
      Object.keys(answers).forEach(k => delete answers[k]);
      render();
    });
  }

  render();

  // ─── NAV TOGGLE ────────────────────────────────────────────────────────────
  const navToggle = document.querySelector(".nav-toggle");
  const mainNav = document.getElementById("mainNav");
  if (navToggle && mainNav) {
    navToggle.addEventListener("click", () => {
      const expanded = navToggle.getAttribute("aria-expanded") === "true";
      navToggle.setAttribute("aria-expanded", String(!expanded));
      mainNav.classList.toggle("open");
    });
  }

})();
</script>
</body>
</html>
